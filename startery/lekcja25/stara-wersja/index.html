<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bossowy Quiz</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato&family=Shojumaru&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Bossowy Quiz</h1>
  <ul>
    <li id="pytanie1"><span>Pytanie 1</span>
      <div class="pytanieKontener">
        <img class="bossImg" src="../img/boss1.svg" alt="Tajemniczy boss numer 1">
        <input type="radio" name="odpowiedz1" id="p1-odp1"><label for="p1-odp1">Ender Dragon</label><br>
        <input type="radio" name="odpowiedz1" id="p1-odp2"><label for="p1-odp2">Drogon</label><br>
        <input type="radio" name="odpowiedz1" id="p1-odp3"><label for="p1-odp3">Shén Lóng</label><br>
      </div>
    </li>
    <li id="pytanie2"><span>Pytanie 2</span>
      <div class="pytanieKontener">
        <img class="bossImg" src="../img/boss2.svg" alt="Tajemniczy boss numer 2">
        <input type="radio" name="odpowiedz2" id="p2-odp1"><label for="p2-odp1">Rider</label><br>
        <input type="radio" name="odpowiedz2" id="p2-odp2"><label for="p2-odp2">Goro</label><br>
        <input type="radio" name="odpowiedz2" id="p2-odp3"><label for="p2-odp3">Shén Lóng</label><br>
      </div>
    </li>
    <li id="pytanie3"><span>Pytanie 3</span>
      <div class="pytanieKontener">
        <img class="bossImg" src="../img/boss3.svg" alt="Tajemniczy boss numer 3">
        <input type="radio" name="odpowiedz3" id="p3-odp1"><label for="p3-odp1">Cell</label><br>
        <input type="radio" name="odpowiedz3" id="p3-odp2"><label for="p3-odp2">Buu</label><br>
        <input type="radio" name="odpowiedz3" id="p3-odp3"><label for="p3-odp3">Freezer</label><br>
      </div>
    </li>
  </ul>
  <button type="button" id="sprawdz">Sprawdź odpowiedzi</button>
</body>
</html>
